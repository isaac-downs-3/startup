<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Axon Trading House</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="main.css" />
  </head>
  <body id="login">
    <header>
      <img src="logo.svg" alt="Axon Trading House logo" width="48" height="48" />
      <h1>Axon Trading House</h1>
      <nav>
        <menu class="nav nav-pills">
          <li class="nav-item"><a class="nav-link active" aria-current="page" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="screener.html">Screener</a></li>
          <li class="nav-item"><a class="nav-link" href="metrics.html">Metrics</a></li>
          <li class="nav-item"><a class="nav-link" href="watchlist.html">Watchlist</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
        </menu>
      </nav>
    </header>

    <main>
      <h2>Welcome</h2>
      <p>Screen and rank companies on metrics you can see the formula for.</p>

      <form method="post" action="screener.html">
        <fieldset>
          <legend>Log in or create an account</legend>
          <p>
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="your@email.com" required />
          </p>
          <p>
            <label for="password">Password</label>
            <input type="password" id="password" name="password" placeholder="password" required />
          </p>
          <button type="submit" name="action" value="login">Log in</button>
          <button type="submit" name="action" value="register">Create account</button>
        </fieldset>
      </form>
    </main>

    <footer>
      <p>Isaac Downs</p>
      <a href="https://github.com/isaac-downs-3/startup">GitHub</a>
    </footer>
  </body>
</html>
