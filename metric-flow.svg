<svg xmlns="http://www.w3.org/2000/svg" width="720" height="220" viewBox="0 0 720 220" role="img" aria-label="Raw fields feed metric formulas, which feed the ranked screener">
  <rect width="720" height="220" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#555555"/>
    </marker>
  </defs>
  <g font-family="Helvetica, Arial, sans-serif" fill="#222222">
    <rect x="20" y="30" width="190" height="160" rx="10" fill="#eef3fb" stroke="#3b6fd8" stroke-width="2"/>
    <text x="115" y="60" font-size="16" font-weight="700" text-anchor="middle">Raw fields</text>
    <text x="115" y="92" font-size="13" text-anchor="middle">revenue</text>
    <text x="115" y="114" font-size="13" text-anchor="middle">netIncome</text>
    <text x="115" y="136" font-size="13" text-anchor="middle">sharesOutstanding</text>
    <text x="115" y="158" font-size="13" text-anchor="middle">price</text>

    <rect x="265" y="30" width="190" height="160" rx="10" fill="#eef8f1" stroke="#2f9e5b" stroke-width="2"/>
    <text x="360" y="60" font-size="16" font-weight="700" text-anchor="middle">Metrics</text>
    <text x="360" y="92" font-size="13" text-anchor="middle">net_margin =</text>
    <text x="360" y="112" font-size="13" text-anchor="middle">netIncome ÷ revenue</text>
    <text x="360" y="140" font-size="13" text-anchor="middle">pe =</text>
    <text x="360" y="160" font-size="13" text-anchor="middle">price ÷ eps_ttm</text>

    <rect x="510" y="30" width="190" height="160" rx="10" fill="#f6f6f6" stroke="#555555" stroke-width="2"/>
    <text x="605" y="60" font-size="16" font-weight="700" text-anchor="middle">Screener</text>
    <text x="605" y="92" font-size="13" text-anchor="middle">1  NVDA  55.8%</text>
    <text x="605" y="114" font-size="13" text-anchor="middle">2  V  54.2%</text>
    <text x="605" y="136" font-size="13" text-anchor="middle">3  META  38.3%</text>
    <text x="605" y="170" font-size="11" text-anchor="middle" fill="#666666">sample data</text>

    <line x1="212" y1="110" x2="261" y2="110" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
    <line x1="457" y1="110" x2="506" y2="110" stroke="#555555" stroke-width="2" marker-end="url(#arrow)"/>
  </g>
</svg>
